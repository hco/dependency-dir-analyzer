[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["homebrew"]
# The GitHub repo to push the Homebrew formula to (must already exist; the
# release job needs a HOMEBREW_TAP_TOKEN secret with write access to it).
tap = "hco/homebrew-tap"
# Actually publish the formula to the tap on release (not just generate it).
publish-jobs = ["homebrew"]
# Name the formula after the binary (`dda`) rather than the crate, so the
# install command is `brew install hco/tap/dda`.
formula = "dda"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Where to host releases
hosting = "github"
