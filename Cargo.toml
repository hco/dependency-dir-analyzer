[package]
name = "dependency-dir-analyzer"
version = "0.2.0"
edition = "2021"
rust-version = "1.74"
description = "Scan a directory tree for dependency directories (node_modules, target, .venv, …) and report how much space they use."
authors = ["Hans-Christian Otto"]
license = "MIT"
repository = "https://github.com/hco/dependency-dir-analyzer"
homepage = "https://github.com/hco/dependency-dir-analyzer"
readme = "README.md"
keywords = ["cli", "disk-usage", "dependencies", "node_modules", "cleanup"]
categories = ["command-line-utilities", "filesystem"]

# The binary is named `dda` for convenience; the crate keeps the descriptive name.
[[bin]]
name = "dda"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
crossterm = "0.28"
csv = "1.3"
humansize = "2.1"
rayon = "1.10"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["formatting"] }
walkdir = "2.5"

# `getattrlist` for APFS clone detection (see `usage.rs`). Hardlinks and block
# counts come from std's `MetadataExt`, so no other platform needs it.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
# Fully inherit [profile.release] (fat LTO, codegen-units=1, strip) so the
# binaries dist ships are identical to a local release build. dist defaults
# this to thin LTO for build speed, which this small crate doesn't need.
inherits = "release"

