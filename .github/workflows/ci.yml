name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # mise installs the toolchain declared in mise.toml and exposes the tasks.
      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          cache: true

      # Cache the cargo registry and target dir for faster builds.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run CI tasks
        run: mise run ci
